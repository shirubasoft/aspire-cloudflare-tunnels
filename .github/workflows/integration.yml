name: Cloudflare Integration Test

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/integration.yml'
      - 'aspire.config.json'
      - 'nuget.config'
      - 'sample/**'
      - 'src/**'

permissions:
  contents: read

concurrency:
  group: cloudflare-integration
  cancel-in-progress: false

jobs:
  live-cloudflare:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install Aspire CLI
        run: dotnet tool install --global Aspire.Cli --version 13.4.6

      - name: Verify Cloudflare secrets
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" || -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN repository secrets are required."
            exit 1
          fi

      - name: Run live Cloudflare integration test
        shell: bash
        run: |
          set -euo pipefail

          cleanup() {
            status=$?
            trap - EXIT

            if [[ $status -ne 0 ]]; then
              aspire describe --format Table --non-interactive || true
              aspire logs my-cloudflare-tunnel-installer --tail 100 --non-interactive || true
              aspire logs my-cloudflare-tunnel-route-autocreated-shiruba-dev --tail 100 --non-interactive || true
              aspire logs my-cloudflare-tunnel --tail 100 --non-interactive || true
            fi

            aspire stop --non-interactive || true
            exit "$status"
          }

          trap cleanup EXIT

          env \
            "Parameters__my-cloudflare-tunnel-account-id=$CLOUDFLARE_ACCOUNT_ID" \
            "Parameters__my-cloudflare-tunnel-api-token=$CLOUDFLARE_API_TOKEN" \
            aspire start --non-interactive --format Json > "$RUNNER_TEMP/aspire-start.json"

          aspire wait hello-world --status healthy --timeout 180 --non-interactive
          aspire wait my-cloudflare-tunnel --status healthy --timeout 180 --non-interactive
          aspire wait my-cloudflare-tunnel-route-autocreated-shiruba-dev --status healthy --timeout 180 --non-interactive

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 6 \
            --retry-all-errors \
            --retry-delay 5 \
            --max-time 30 \
            --output "$RUNNER_TEMP/cloudflare-response.html" \
            https://autocreated.shiruba.dev

          grep --quiet 'Welcome to nginx!' "$RUNNER_TEMP/cloudflare-response.html"
